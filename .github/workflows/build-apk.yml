name: Build Surya Marketing Blaster

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q Surya_Marketing_Blaster_Mobile_Build.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/Surya_Marketing_Blaster :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Surya-Marketing-Blaster-APK
          path: extracted/Surya_Marketing_Blaster/app/build/outputs/apk/debug/app-debug.apk
